<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel Astra 2011 Branco Dashboard</title>
<link rel="stylesheet" href="astra.css">
</head>
<body>
<!-- tela retangular 1920x720 (8:3), sem a carcaça -->
<svg id="p" class="tela" viewBox="0 0 1920 720" role="img" aria-label="Painel Astra 2011 branco em tela retangular">
  <defs><linearGradient id="tela" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c0e11"/><stop offset="1" stop-color="#181b20"/></linearGradient></defs>
  <rect width="1920" height="720" rx="26" fill="url(#tela)" stroke="#2a2f36" stroke-width="2"/>
  <g id="painel"></g>
</svg>
<div id="ctl"></div>

<script src="../versoes.js"></script><!-- etiqueta da versão no canto; sem o arquivo, a página abre igual -->
<script src="icones.js"></script>
<script src="astra.js"></script>
<script>
// mesma disposição do painel original, ampliada 2x e centralizada na tela
Astra.build({
  target: document.getElementById('painel'),
  place: Object.fromEntries(Object.entries(Astra.PLACE).map(([k, [x, y]]) => [k, [(x - 600) * 2 + 960, (y - 258) * 2 + 360, 2]])),
});
</script>
</body>
</html>
