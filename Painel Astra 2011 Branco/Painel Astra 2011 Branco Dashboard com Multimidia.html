<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel Astra 2011 Branco Dashboard com Multimidia</title>
<link rel="stylesheet" href="astra.css">
</head>
<body>
<!-- tela retangular 1920x720: conta-giros à esquerda, multimídia no meio, velocímetro à direita -->
<svg id="p" class="tela" viewBox="0 0 1920 720" role="img" aria-label="Painel Astra 2011 branco com multimídia">
  <defs><linearGradient id="tela" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c0e11"/><stop offset="1" stop-color="#181b20"/></linearGradient></defs>
  <rect width="1920" height="720" rx="26" fill="url(#tela)" stroke="#2a2f36" stroke-width="2"/>
  <g id="painel"></g>
  <g id="mm"></g>
</svg>
<div id="ctl"></div>

<script src="icones.js"></script>
<script src="astra.js"></script>
<script src="multimidia.js"></script>
<script>
// cada peça no seu canto: [x, y, escala]
Astra.build({
  target: document.getElementById('painel'),
  place: { tach: [285, 292, 1.66], temp: [112, 612, 1.32], spd: [1635, 292, 1.66], fuel: [1808, 612, 1.32], topo: [960, 40, 1.1],
    baixoEsq: [385, 606, 1.3], esq: [385, 664, 1.3], baixoDir: [1535, 606, 1.3], dir: [1535, 664, 1.3], pino: [1757, 518, 1.6] },
});
Multimidia.build({ target: document.getElementById('mm'), contato: 'Ayrton Senna' });
</script>
</body>
</html>
