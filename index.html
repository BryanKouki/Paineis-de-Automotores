<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painéis de Automotores</title>
<link rel="icon" href="launcher/icone.ico">
<style>
  html,body{height:100%;margin:0}
  body{background:#14171b;color:#e6e9ee;font:15px system-ui,"Segoe UI",sans-serif}
  #menu{min-height:100%;box-sizing:border-box;padding:28px 20px 40px;display:flex;flex-direction:column;align-items:center;gap:22px}
  h1{margin:0;font-size:26px;font-weight:600}
  #menu>p{margin:-14px 0 0;color:#9aa3ae}
  #lista{display:flex;flex-wrap:wrap;gap:20px;justify-content:center;width:100%;max-width:1180px}
  .carro{flex:1 1 320px;max-width:370px;background:#1d2228;border:1px solid #2e353e;border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
  .logo{background:#fff;height:170px;box-sizing:border-box;padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
  .logo img{max-width:86%;max-height:100%;min-height:0;object-fit:contain}
  .logo .versoes{display:flex;align-items:center;justify-content:center;gap:18px;max-width:100%}
  .logo .versoes img{max-width:none;height:34px}
  .info{padding:16px;display:flex;flex-direction:column;gap:10px;flex:1}
  h2{margin:0;font-size:18px}
  h2 small{font-size:12px;font-weight:400;color:#8b949e}
  .info p{margin:0 0 4px;color:#9aa3ae;line-height:1.45;flex:1}
  button{font:inherit;color:inherit;cursor:pointer;border-radius:8px;border:1px solid #3a4350;background:#262d35;padding:9px 12px;text-align:left}
  button:hover,button:focus-visible{background:#32506f;border-color:#4a7fb5;outline:none}
  #tela{position:fixed;inset:0;width:100%;height:100%;border:0;background:#14171b}
  #voltar{position:fixed;top:8px;left:8px;z-index:2;padding:6px 12px;background:#14171bcc}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main id="menu">
  <h1>Painéis de Automotores</h1>
  <p>Escolha o painel e a versão.</p>
  <div id="lista"></div>
</main>
<iframe id="tela" title="Painel escolhido" allow="gamepad" hidden></iframe>
<button id="voltar" hidden>← Painéis</button>

<script src="versoes.js"></script>
<script>
// cada painel: pasta e começo do nome dos três arquivos; logos = imagens da pasta logos (as "versões" ficam juntas embaixo)
const PAINEIS = [
  { nome: 'Chevrolet Corsa', arquivo: 'Painel Corsa GLS Millenium Super com conta giros', logos: ['corsa'], versoes: ['super', 'milenium'],
    texto: 'Painel azul com conta-giros dos Corsa GLS, Milenium e Super: hodômetro de tambores, luzes-espia de fundo aceso e iluminação âmbar.' },
  { nome: 'Chevrolet Astra 2011', arquivo: 'Painel Astra 2011 Branco', logos: ['astra'],
    texto: 'Mostradores brancos com hodômetro digital, 23 luzes-espia, aviso de troca de marcha e de velocidade máxima.' },
  { nome: 'Honda CG 125 Titan 2000', arquivo: 'Painel CG 125 2000', logos: ['cg'],
    texto: 'Velocímetro, espias com lente, miolo de ignição que liga o painel e a boia de combustível com mau contato.' },
];
const TIPOS = [['', 'Painel original (com a carcaça)'], [' Dashboard', 'Dashboard (tela retangular)'], [' Dashboard com Multimidia', 'Dashboard com multimídia']];
const $ = id => document.getElementById(id), img = (n, alt) => `<img src="logos/${n}.png" alt="${alt}">`;

$('lista').innerHTML = PAINEIS.map((p, i) => `<section class="carro">
  <div class="logo">${p.logos.map(n => img(n, p.nome)).join('')}${p.versoes ? `<div class="versoes">${p.versoes.map(n => img(n, n)).join('')}</div>` : ''}</div>
  <div class="info"><h2>${p.nome} <small>v${VERSOES[p.arquivo]}</small></h2><p>${p.texto}</p>${TIPOS.map(([fim, rotulo]) => `<button data-url="${p.arquivo}/${p.arquivo}${fim}.html">${rotulo}</button>`).join('')}</div>
</section>`).join('');

// aberto pelo executável, o endereço traz a porta da ponte com a mídia do Windows (?ponte=...); ela é repassada aos painéis
const ponte = new URLSearchParams(location.search).get('ponte');
if (ponte) {
  // a ponte fecha sozinha se ficar sem notícias; avisa que a janela continua aberta e quando fechar
  setInterval(() => fetch(`http://localhost:${ponte}/vivo`).catch(() => {}), 20000);
  addEventListener('pagehide', () => navigator.sendBeacon(`http://localhost:${ponte}/sair`));
}
// o painel abre num quadro por cima do menu; "← Painéis" volta
const mostrar = url => { $('tela').src = url ? encodeURI(url) + (ponte ? '?ponte=' + ponte : '') : 'about:blank'; for (const id of ['tela', 'voltar']) $(id).hidden = !url; for (const id of ['menu', 'versao']) $(id).hidden = !!url; if (url) $('tela').focus(); }; // com um painel aberto vale a etiqueta de versão dele
$('lista').onclick = e => { const b = e.target.closest('button'); if (b) mostrar(b.dataset.url); };
$('voltar').onclick = () => mostrar('');
</script>
</body>
</html>
