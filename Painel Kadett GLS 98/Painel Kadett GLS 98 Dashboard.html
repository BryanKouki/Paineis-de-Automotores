<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel Kadett GLS 98 Dashboard</title>
<link rel="stylesheet" href="kadett.css">
</head>
<body>
<!-- tela retangular 1920x720 (8:3), sem a carcaça -->
<svg id="p" viewBox="0 0 1920 720" role="img" aria-label="Painel do Kadett GLS 98 em tela retangular">
  <defs><linearGradient id="tela" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d0f12"/><stop offset="1" stop-color="#181b1f"/></linearGradient></defs>
  <rect width="1920" height="720" rx="26" fill="url(#tela)" stroke="#2a2f36" stroke-width="2"/>
  <g id="painel"></g>
</svg>
<div id="ctl"></div>

<script src="../versoes.js"></script><!-- etiqueta da versão no canto; sem o arquivo, a página abre igual -->
<script src="../controle.js"></script><!-- controle de videogame; sem o arquivo, a página abre igual -->
<script src="som.js"></script><!-- som do motor; sem o arquivo, a página abre igual, sem som -->
<script src="kadett.js"></script>
<script>
// mesma disposição do painel original, ampliada 1,6x e centralizada na tela
const M = (x, y) => [(x - 602.5) * 1.6 + 960, (y - 282) * 1.6 + 360];
Kadett.build({ target: document.getElementById('painel'), place: Object.fromEntries(Object.entries(Kadett.ORIGEM).map(([k, [x, y]]) => [k, [...M(x, y), 1.6]])) });
</script>
</body>
</html>
