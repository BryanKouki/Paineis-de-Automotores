<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel CG 125 2000 Dashboard com Multimidia</title>
<link rel="stylesheet" href="cg.css">
</head>
<body>
<!-- tela retangular 1920x720: velocímetro à esquerda, multimídia no meio, espias e combustível à direita -->
<svg id="p" viewBox="0 0 1920 720" role="img" aria-label="Painel Honda CG 125 2000 com multimídia">
  <defs><linearGradient id="tela" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c0e11"/><stop offset="1" stop-color="#181b20"/></linearGradient></defs>
  <rect width="1920" height="720" rx="26" fill="url(#tela)" stroke="#2a2f36" stroke-width="2"/>
  <g id="painel"></g>
  <g id="mm"></g>
</svg>
<div id="ctl"></div>

<script src="../versoes.js"></script><!-- etiqueta da versão no canto; sem o arquivo, a página abre igual -->
<script src="icones.js"></script>
<script src="cg.js"></script>
<script src="multimidia.js"></script>
<script>
// cápsulas nas laterais e o miolo da ignição na barra de baixo; a plaquinha da Honda não cabe aqui
CG.build({ target: document.getElementById('painel'), place: { spd: [287, 330, 1.6], pod: [1633, 330, 1.6], ign: [1060, 684, .7], honda: null } });
Multimidia.build({
  target: document.getElementById('mm'), contato: 'Valentino Rossi',
  tema: { acento: '#e8442e', capa: ['#ff7566', '#6a1712'], hora: 'italic 600 30px "Segoe UI",Arial,sans-serif' },
});
</script>
</body>
</html>
