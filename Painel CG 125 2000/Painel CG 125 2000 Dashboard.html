<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel CG 125 2000 Dashboard</title>
<link rel="stylesheet" href="cg.css">
</head>
<body>
<!-- tela retangular 1920x720 (8:3), sem a carcaça -->
<svg id="p" viewBox="0 0 1920 720" role="img" aria-label="Painel Honda CG 125 2000 em tela retangular">
  <defs><linearGradient id="tela" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c0d0f"/><stop offset="1" stop-color="#18191c"/></linearGradient></defs>
  <rect width="1920" height="720" rx="26" fill="url(#tela)" stroke="#2a2c31" stroke-width="2"/>
  <g id="painel"></g>
</svg>
<div id="ctl"></div>

<script src="../versoes.js"></script><!-- etiqueta da versão no canto; sem o arquivo, a página abre igual -->
<script src="icones.js"></script>
<script src="cg.js"></script>
<script>
// as duas cápsulas ampliadas, com a plaquinha da Honda e o miolo da ignição no meio
CG.build({ target: document.getElementById('painel'), place: { spd: [500, 360, 1.95], pod: [1420, 360, 1.95], ign: [960, 470, 1.9], honda: [960, 250, 1.9] } });
</script>
</body>
</html>
